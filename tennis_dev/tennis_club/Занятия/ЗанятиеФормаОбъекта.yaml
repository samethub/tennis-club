ВидЭлемента: КомпонентИнтерфейса
Ид: 8b7d07ee-0c1a-4292-92db-6c271d0faa7f
Имя: ЗанятиеФормаОбъекта
ОбластьВидимости: ВПодсистеме
Импорт:
    - НСИ
Наследует:
    Тип: ФормаОбъекта<Занятие.Объект>
    ВключатьВАвтоИнтерфейс: Ложь
    Заголовок: Занятие
    РастягиватьПоВертикали: Истина
    ОсновнаяКоманда: =ЗаписатьИЗакрыть
    Содержимое:
        Тип: ШаблонФормыСРазделами
        РастягиватьПоВертикали: Истина
        ОсновнойРаздел:
            Тип: Группа
            Заголовок: Основное
            ШиринаВКолонках: Одинарная
            Содержимое:
                -
                    Тип: ПолеВвода<Строка>
                    Имя: Номер
                    Значение: =Объект.Номер
                -
                    Тип: ПолеВвода<ДатаВремя>
                    Имя: Дата
                    Значение: =Объект.Дата
                -
                    Тип: ПолеВвода<ФорматыЗанятий>
                    Имя: Формат
                    Значение: =Объект.Формат
                -
                    Тип: ПолеВвода<Клиенты.Ссылка?>
                    Имя: Клиент
                    Значение: =Объект.Клиент
                    Видимость: =Объект.Формат == ФорматыЗанятий.Индивидуальное
                -
                    Тип: ПолеВвода<ГрупповоеРасписание.Ссылка?>
                    Имя: Расписание
                    Значение: =Объект.Расписание
                    Видимость: =Объект.Формат == ФорматыЗанятий.Групповое
                    ПриИзменении: РасписаниеПриИзменении
                -
                    Тип: ПолеВвода<Корты.Ссылка?>
                    Имя: Корт
                    Значение: =Объект.Корт
                    Доступность: =Объект.Формат == ФорматыЗанятий.Индивидуальное
                -
                    Тип: ПолеВвода<Тренеры.Ссылка?>
                    Имя: Тренер
                    Значение: =Объект.Тренер
                    Доступность: =Объект.Формат == ФорматыЗанятий.Индивидуальное
                -
                    Тип: ПолеВвода<Число>
                    Имя: Длительность
                    Значение: =Объект.Длительность
                    Доступность: =Ложь
                -
                    Тип: ПолеВвода<Число>
                    Имя: Количество
                    Значение: =Объект.Количество
                    Доступность: =Объект.Формат == ФорматыЗанятий.Индивидуальное
                    ПриИзменении: КоличествоПриИзменении
                -
                    Тип: ПолеВвода<Число>
                    Имя: Цена
                    Значение: =Объект.Цена
                    Доступность: =Ложь
                -
                    Тип: Флажок
                    Имя: ПоАбонементу
                    Значение: =Объект.ПоАбонементу
                    Доступность: =Ложь
                -
                    Тип: Флажок
                    Имя: Отменено
                    Значение: =Объект.Отменено
        ДополнительныеРазделы:
            -
                Тип: Группа
                Заголовок: Участники
                ШиринаВКолонках: Двойная
                Видимость: =Объект.Формат == ФорматыЗанятий.Групповое
                Содержимое:
                    -
                        Тип: СворачиваемыйКомпонент
                        Заголовок: Участники
                        РастягиватьПоГоризонтали: Истина
                        ШиринаВКолонках: Четверная
                        Содержимое:
                            Тип: Таблица<ИсточникДанныхМассив<Занятие.Участники>>
                            Имя: Участники
                            ВидОтображенияКомандСтроки: ПриНаведении
                            ОтображатьНумерациюСтрок: Ложь
                            РастягиватьПоВертикали: Ложь
                            ШиринаВКолонках: Четверная
                            Источник:
                                Данные: =Объект.Участники
                            Колонки:
                                -
                                    Тип: СтандартнаяКолонкаТаблицы<Занятие.Участники>
                                    Заголовок: Клиент
                                    ПолеЗначения: Клиент
                                    НастройкиРедактирования:
                                        Тип: НастройкиРедактированияПоляВвода
                                -
                                    Тип: СтандартнаяКолонкаТаблицы<Занятие.Участники>
                                    Заголовок: По абонементу
                                    ПолеЗначения: ПоАбонементу
                            Команды:
                                Тип: ФрагментКомандногоИнтерфейса
                                Элементы:
                                    - =Компоненты.Участники.ДобавитьСтроку
                            КомандыСтроки:
                                Тип: ФрагментКомандногоИнтерфейса<КомандаСПараметром<Занятие.Участники>>
                                Элементы:
                                    - =Компоненты.Участники.Удалить
